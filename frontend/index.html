<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ycgsf</title>
<style>
  :root { color-scheme: dark; --fg: #f5f5f5; --dim: #a3a3a3; --bg: #0a0a0a; --line: #262626; --ok: #4ade80; --warn: #facc15; --bad: #f87171; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 18px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px 40px; display: grid; gap: 16px; }
  h1 { margin: 0; font-size: 26px; letter-spacing: -.01em; }
  #say { font-size: 34px; line-height: 1.25; min-height: 2.5em; font-weight: 650; }
  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
  .box { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .k { color: var(--dim); font-size: 14px; } .v { font-size: 20px; font-weight: 650; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
  video { width: 100%; max-height: 300px; object-fit: cover; border-radius: 12px; background: #111; }
  #start { font: inherit; font-size: 24px; padding: 18px; border-radius: 14px; border: 0; background: var(--fg); color: #000; cursor: pointer; }
  kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 6px; padding: 1px 7px; font-size: 15px; }
  #keys { color: var(--dim); font-size: 15px; display: flex; flex-wrap: wrap; gap: 6px 16px; }
  select, input { font: inherit; font-size: 15px; background: #111; color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 6px; }
  #log { font: 13px/1.4 ui-monospace, monospace; color: var(--dim); max-height: 180px; overflow: auto; white-space: pre-wrap; }
</style>
</head>
<body>
<main>
  <h1>ycgsf · you can go so far</h1>
  <button id="start">Press Enter to start (turns on sound, camera, microphone, GPS)</button>
  <div id="say" aria-live="assertive">Not started.</div>
  <div class="row">
    <div class="box"><div class="k">GPS</div><div class="v" id="gps">–</div></div>
    <div class="box"><div class="k">Heading</div><div class="v" id="heading">–</div></div>
    <div class="box"><div class="k">Next</div><div class="v" id="next">no route</div></div>
    <div class="box"><div class="k">Way ahead</div><div class="v" id="clear">–</div></div>
    <div class="box"><div class="k">Models (4090)</div><div class="v" id="server">–</div></div>
  </div>
  <video id="cam" autoplay muted playsinline></video>
  <div class="row">
    <label class="box"><div class="k">Camera (point it forward)</div><select id="camsel"></select></label>
    <label class="box"><div class="k">Headphones upside down (swap L/R)</div><select id="invert"><option value="1">yes, swap</option><option value="0">no</option></select></label>
    <label class="box"><div class="k">Model server</div><input id="srv"></label>
  </div>
  <div id="keys">
    <span><kbd>Space</kbd> hold to talk</span><span><kbd>D</kbd> what's around</span><span><kbd>B</kbd> go back</span>
    <span><kbd>S</kbd> remember this spot</span><span><kbd>R</kbd> repeat</span><span><kbd>P</kbd> pause/resume</span>
    <span><kbd>T</kbd> test left/right taps</span><span><kbd>←</kbd><kbd>→</kbd> I turned left/right</span>
    <span>Simulate walking: <kbd>W</kbd> step, <kbd>A</kbd>/<kbd>F</kbd> rotate</span>
  </div>
  <div id="log"></div>
</main>
<script src="app.js"></script>
</body>
</html>
