name: Pip
options:
  bundleIdPrefix: com.ycgsf
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Pip:
    type: application
    platform: iOS
    sources:
      - path: Pip
      - path: ../frontend
        type: folder
        buildPhase: resources
    info:
      path: Pip/Info.plist
      properties:
        CFBundleDisplayName: Pip
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiredDeviceCapabilities: [arm64]
        NSCameraUsageDescription: Pip looks ahead with the camera to find doors, rooms, and objects for you.
        NSMicrophoneUsageDescription: Pip listens so you can talk to it.
        NSMotionUsageDescription: Pip measures your turns and steps to guide you and walk you back.
        NSLocationWhenInUseUsageDescription: Pip uses GPS only when you ask to go somewhere outside.
        NSLocalNetworkUsageDescription: Pip talks to its model server on your network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIApplicationSupportsIndirectInputEvents: true
        UIStatusBarHidden: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ycgsf.pip
        INFOPLIST_FILE: Pip/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
